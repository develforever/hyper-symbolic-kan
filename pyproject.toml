[build-system]
requires = [
    "scikit-build-core>=0.10.0",
    "nanobind>=2.0.0",
    "ninja"
]
build-backend = "scikit_build_core.build"

[project]
name = "hyper-symbolic-kan"
version = "0.1.0"
description = "Algebraic & Hyper-Symbolic Neural Architecture Sandbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "sympy>=1.12",
    "nanobind>=2.0.0",
    "safetensors>=0.4.0"
]

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build"
wheel.packages = ["src"]

[tool.pytest.ini_options]
# Benchmarks live in benchmarks/ and are not collected by `pytest tests/`.
testpaths = ["tests"]
